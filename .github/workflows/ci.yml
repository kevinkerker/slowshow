# Reproduzierbarer Build und Testlauf.
#
# Das Lastenheft nennt einen CI-Build gleich zweimal als Gegenmaßnahme:
# bei R-11 (Ein-Personen-Projekt, schwankende Zeit) und bei R-13
# (Play-Store-Pflegepflicht). Ohne Pipeline bliebe das eine Absichtserklärung.
#
# Der Android-Build läuft bewusst nur auf `main` und bei Tags: er dauert
# deutlich länger als der Rest, und für einen Pull Request genügt es zu wissen,
# dass Tests und Typen stimmen.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Erlaubt einen Lauf von Hand — nützlich für das jährliche Wartungsfenster
  # aus R-13, wenn Google das Target-API-Level anhebt.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests
        run: npm run test:run

      - name: Bündel bauen
        run: npx vite build

      # NF-10 verlangt eine APK unter 30 MB. Das Frontend-Bündel ist der Teil,
      # der beim Entwickeln unbemerkt wachsen kann — deshalb hier eine Schranke,
      # lange bevor die APK gebaut wird.
      - name: Bündelgröße prüfen (NF-10)
        run: |
          SIZE=$(du -sk dist | cut -f1)
          echo "Bündel: ${SIZE} KB"
          if [ "$SIZE" -gt 4096 ]; then
            echo "::error::Frontend-Bündel über 4 MB — NF-10 (APK < 30 MB) gefährdet"
            exit 1
          fi

  backend:
    name: Rust-Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri braucht auf Linux GTK und WebKit, auch wenn nur geprüft wird.
      - name: Systemabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # Der Build braucht Icons; sie werden aus der Design-Vorlage erzeugt
      # statt binär eingecheckt.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run icons

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  android:
    name: Android-APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: NDK einrichten
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run icons

      - name: Android-Projekt erzeugen
        run: npx tauri android init

      # Spielt den handgeschriebenen Kotlin-Code ein und prüft ihn.
      # Schlägt fehl, wenn Vollbild, Wakelock oder die Manifest-Einträge fehlen.
      - name: Nativen Code einspielen (FA-01, FA-50, FA-53)
        run: node scripts/patch-android.mjs

      - name: Debug-APK bauen
        run: npx tauri android build --apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: slowshow-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
